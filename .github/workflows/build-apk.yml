
name: Gerar APK Santa Clara

on:
  workflow_dispatch:
  push:
    paths:
      - 'Santa_Clara_Transportes_Android_Com_Logo_CORRETO.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto atualizado
        run: |
          mkdir projeto
          unzip -o Santa_Clara_Transportes_Android_Com_Logo_CORRETO.zip -d projeto
          cp -r projeto/. .
          rm -rf projeto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Clara-Transportes
          path: app/build/outputs/apk/debug/app-debug.apk
