

name: Gerar APK Santa Clara

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP nao encontrado na raiz"
            exit 1
          fi
          mkdir -p /tmp/santa-clara
          unzip -o "$ZIP" -d /tmp/santa-clara
          ROOT=$(find /tmp/santa-clara -name settings.gradle -type f | head -n 1 | xargs dirname)
          cp "$ROOT/settings.gradle" .
          cp "$ROOT/build.gradle" .
          cp "$ROOT/gradle.properties" .
          cp -R "$ROOT/app" .

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Clara-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
